<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="Arial, Helvetica, sans-serif" font-size="13">
<title>Paso 1 · Procesando los documentos (v1, baja fidelidad)</title>
<style>
.t{fill:#222}.g{fill:#777}.p{fill:#fff;stroke:#bbb}.ver{fill:#1E7B4F}
.n circle{fill:#1E7B4F}.n text{fill:#fff;font-weight:bold;font-size:12px;text-anchor:middle}
.btn{fill:#f2f2f2;stroke:#888}
.hecha{fill:#1E7B4F}.curso{fill:#cfe8da;stroke:#1E7B4F;stroke-dasharray:3 2}.pend{fill:#fff;stroke:#aaa}
</style>
<rect width="1200" height="780" fill="#fafafa"/>
<rect width="1200" height="44" fill="#1E7B4F"/><text x="16" y="28" fill="#fff" font-size="16" font-weight="bold">Comparador normativo</text>
<text x="20" y="76" class="t" font-size="18" font-weight="bold">Leyendo tus documentos</text>
<text x="20" y="96" class="g">Puedes cambiar de pestaña: te avisaremos en el título de la ventana cuando termine.</text>

<!-- stepper -->
<g>
<circle cx="60" cy="140" r="14" class="ver"/><text x="60" y="145" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
<text x="82" y="145" class="t" font-weight="bold">Leyendo las páginas</text>
<line x1="230" y1="140" x2="330" y2="140" stroke="#bbb"/>
<circle cx="350" cy="140" r="14" fill="#fff" stroke="#999"/><text x="350" y="145" class="g" text-anchor="middle">2</text>
<text x="372" y="145" class="g">Armando el índice</text>
<line x1="500" y1="140" x2="600" y2="140" stroke="#bbb"/>
<circle cx="620" cy="140" r="14" fill="#fff" stroke="#999"/><text x="620" y="145" class="g" text-anchor="middle">3</text>
<text x="642" y="145" class="g">Preparando la búsqueda</text>
</g>

<!-- tarjeta documento activo -->
<rect x="20" y="170" width="760" height="300" class="p" rx="6"/>
<text x="36" y="196" class="t" font-weight="bold" font-size="15">Ley_1234_LAFT.pdf</text>
<text x="764" y="196" class="g" text-anchor="end">documento 1 de 2</text>
<text x="36" y="222" class="t">Páginas leídas: <tspan font-weight="bold">20 de 55</tspan> · ahora leyendo la 21 a la 25</text>
<!-- tira de paginas: 11 por fila -->
<g id="tira">
<g class="hecha">
<rect x="36" y="238" width="28" height="36" rx="2"/><rect x="70" y="238" width="28" height="36" rx="2"/><rect x="104" y="238" width="28" height="36" rx="2"/><rect x="138" y="238" width="28" height="36" rx="2"/><rect x="172" y="238" width="28" height="36" rx="2"/><rect x="206" y="238" width="28" height="36" rx="2"/><rect x="240" y="238" width="28" height="36" rx="2"/><rect x="274" y="238" width="28" height="36" rx="2"/><rect x="308" y="238" width="28" height="36" rx="2"/><rect x="342" y="238" width="28" height="36" rx="2"/>
<rect x="376" y="238" width="28" height="36" rx="2"/><rect x="410" y="238" width="28" height="36" rx="2"/><rect x="444" y="238" width="28" height="36" rx="2"/><rect x="478" y="238" width="28" height="36" rx="2"/><rect x="512" y="238" width="28" height="36" rx="2"/><rect x="546" y="238" width="28" height="36" rx="2"/><rect x="580" y="238" width="28" height="36" rx="2"/><rect x="614" y="238" width="28" height="36" rx="2"/><rect x="648" y="238" width="28" height="36" rx="2"/><rect x="682" y="238" width="28" height="36" rx="2"/>
</g>
<g class="curso">
<rect x="716" y="238" width="28" height="36" rx="2"/>
<rect x="36" y="282" width="28" height="36" rx="2"/><rect x="70" y="282" width="28" height="36" rx="2"/><rect x="104" y="282" width="28" height="36" rx="2"/><rect x="138" y="282" width="28" height="36" rx="2"/>
</g>
<g class="pend">
<rect x="172" y="282" width="28" height="36" rx="2"/><rect x="206" y="282" width="28" height="36" rx="2"/><rect x="240" y="282" width="28" height="36" rx="2"/><rect x="274" y="282" width="28" height="36" rx="2"/><rect x="308" y="282" width="28" height="36" rx="2"/><rect x="342" y="282" width="28" height="36" rx="2"/><rect x="376" y="282" width="28" height="36" rx="2"/><rect x="410" y="282" width="28" height="36" rx="2"/><rect x="444" y="282" width="28" height="36" rx="2"/><rect x="478" y="282" width="28" height="36" rx="2"/>
<rect x="512" y="282" width="28" height="36" rx="2"/><rect x="546" y="282" width="28" height="36" rx="2"/><rect x="580" y="282" width="28" height="36" rx="2"/><rect x="614" y="282" width="28" height="36" rx="2"/><rect x="648" y="282" width="28" height="36" rx="2"/><rect x="682" y="282" width="28" height="36" rx="2"/><rect x="716" y="282" width="28" height="36" rx="2"/>
</g>
</g>
<text x="36" y="342" class="g" font-size="11">▇ leída   ▒ en lectura (lote actual, pulso suave)   ▢ pendiente.  Cada cuadro es una página real del PDF; no es una vista del contenido.</text>
<!-- barra -->
<rect x="36" y="358" width="728" height="12" fill="#e5e5e5" rx="6"/><rect x="36" y="358" width="265" height="12" class="ver" rx="6"/>
<text x="36" y="394" class="t"><tspan font-weight="bold">36 %</tspan> · Transcurrido 3:10 · Quedan unos <tspan font-weight="bold">5 a 8 min</tspan> (estimado con el ritmo de las últimas páginas)</text>
<text x="36" y="414" class="g">Última novedad hace 14 s · cada lote de 5 páginas tarda cerca de 45 s en este equipo</text>
<rect x="36" y="428" width="120" height="30" class="btn" rx="4"/><text x="96" y="448" class="t" text-anchor="middle">Cancelar</text>
<text x="168" y="448" class="g">Los documentos ya listos se conservan.</text>

<!-- lista otros docs -->
<rect x="20" y="486" width="760" height="150" class="p" rx="6"/>
<text x="36" y="510" class="t" font-weight="bold">Todos los documentos</text>
<text x="36" y="536" class="t">Manual_LAFT.pdf</text><text x="560" y="536" class="g">En cola · 30 págs.</text>
<text x="36" y="562" class="t">Ley_1234_LAFT.pdf</text><text x="560" y="562" class="t">● Leyendo · 20/55 págs.</text>
<text x="36" y="588" class="t">Circular_007.pdf</text><text x="560" y="588" class="ver" style="fill:#1E7B4F">✔ Listo · 31 artículos · 2 por revisar</text>
<text x="36" y="614" class="t">Escaneado.pdf</text><text x="560" y="614" style="fill:#B3261E">✖ No se puede leer (ERR-ING-001) · [Quitar]</text>

<!-- panel lateral: lo encontrado -->
<rect x="800" y="170" width="380" height="300" class="p" rx="6"/>
<text x="816" y="196" class="t" font-weight="bold" font-size="15">Lo que vamos encontrando</text>
<text x="816" y="222" class="g">Disponible al terminar la lectura de cada documento:</text>
<text x="816" y="250" class="t">Circular_007.pdf</text>
<text x="816" y="272" class="t">· 31 artículos detectados</text>
<text x="816" y="292" class="t">· 4 secciones excluidas (índice, carátula)</text>
<text x="816" y="312" class="t">· 2 secciones por revisar ⚠</text>
<text x="816" y="344" class="g" font-size="11">Son conteos reales del índice armado. Antes de eso, solo se muestra el avance de páginas.</text>
<rect x="816" y="360" width="348" height="40" fill="#f6fbf8" stroke="#1E7B4F" rx="4"/>
<text x="828" y="385" class="t">Circular_007 ya está lista. [Ver su índice]</text>
<text x="816" y="436" class="g" font-size="11">Los documentos listos se pueden abrir mientras otros siguen.</text>

<!-- estados -->
<rect x="20" y="654" width="1160" height="100" class="p" rx="6"/>
<text x="36" y="678" class="t" font-weight="bold">Otros estados</text>
<text x="36" y="700" class="g">Sin avance por más de 2× el tiempo del lote: "Este lote tarda más de lo normal. Sigue trabajando; puedes esperar o cancelar."</text>
<text x="36" y="720" class="g">Etapas 2 y 3 (rápidas): el paso 2 muestra "Armando el índice… " y el 3 "Preparando la búsqueda: 12 de 30 bloques".</text>
<text x="36" y="740" class="g">Error: mensaje de negocio + código corto, el resto de documentos continúa. Sesión perdida: mensaje de docs/05.</text>

<g class="n">
<circle cx="250" cy="130" r="10"/><text x="250" y="134">1</text>
<circle cx="760" cy="230" r="10"/><text x="760" y="234">2</text>
<circle cx="716" cy="228" r="0"/>
<circle cx="740" cy="362" r="10"/><text x="740" y="366">3</text>
<circle cx="740" cy="398" r="10"/><text x="740" y="402">4</text>
<circle cx="170" cy="444" r="0"/>
<circle cx="140" cy="506" r="10"/><text x="140" y="510">5</text>
<circle cx="1150" cy="196" r="10"/><text x="1150" y="200">6</text>
<circle cx="150" cy="474" r="10"/><text x="150" y="478">7</text>
</g>
</svg>
