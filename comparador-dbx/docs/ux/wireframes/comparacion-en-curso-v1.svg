<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" font-family="Arial, Helvetica, sans-serif" font-size="13">
<title>Comparando: lista de pares con el resultado en cada fila (v1, baja fidelidad)</title>
<style>
.t{fill:#222}.g{fill:#6b6b6b}.p{fill:#fff;stroke:#bbb}.ver{fill:#1E7B4F}.b{font-weight:bold}
.n circle{fill:#1E7B4F}.n text{fill:#fff;font-weight:bold;font-size:12px;text-anchor:middle}
.btn{fill:#fff;stroke:#1E7B4F}.chip{fill:#f2f2f2;stroke:#999}.chipa{fill:#e7f3ec;stroke:#1E7B4F}.lit{fill:#f4f4f4;stroke:#ccc}
</style>
<rect width="1100" height="900" fill="#fafafa"/>
<rect width="1100" height="40" fill="#1E7B4F"/><text x="16" y="26" fill="#fff" font-size="15" font-weight="bold">Comparador normativo</text>

<!-- RESUMEN FIJO -->
<rect x="20" y="52" width="1060" height="190" class="p"/>
<text x="36" y="80" class="t b" font-size="17">Comparando</text>
<text x="140" y="80" class="g">Paso 2 de 3 · Evaluando cada par</text>
<rect x="36" y="94" width="760" height="12" fill="#e3e3e3"/><rect x="36" y="94" width="228" height="12" class="ver"/>
<text x="36" y="128" class="t b" font-size="15">12 de 40 pares resueltos</text>
<text x="230" y="128" class="g">2 en análisis · 26 en espera</text>
<text x="36" y="150" class="t">Tiempo transcurrido: <tspan class="b">36 min 20 s</tspan> · Falta aproximadamente: entre 1 h 5 min y 2 h</text>
<rect x="880" y="66" width="184" height="36" rx="6" class="btn"/><text x="972" y="89" text-anchor="middle" fill="#1E7B4F" class="b">Cancelar comparación</text>
<!-- chips -->
<rect x="36" y="166" width="90" height="28" rx="14" class="chipa"/><text x="81" y="185" text-anchor="middle" class="t b">Todos (12)</text>
<rect x="134" y="166" width="190" height="28" rx="14" class="chip"/><text x="229" y="185" text-anchor="middle" class="t">● Cubre por completo (5)</text>
<rect x="332" y="166" width="160" height="28" rx="14" class="chip"/><text x="412" y="185" text-anchor="middle" class="t">◐ Cubre en parte (4)</text>
<rect x="500" y="166" width="140" height="28" rx="14" class="chip"/><text x="570" y="185" text-anchor="middle" fill="#c23b32" class="b">✕ No lo cubre (2)</text>
<rect x="648" y="166" width="140" height="28" rx="14" class="chip"/><text x="718" y="185" text-anchor="middle" class="t">⚠ Por revisar (3)</text>
<text x="36" y="222" class="g" font-size="12">Cada par puede tardar varios minutos con el modelo local. Puedes dejar esta pestaña abierta o volver más tarde: el avance se conserva.</text>

<!-- EN ANALISIS -->
<rect x="20" y="256" width="1060" height="44" class="p"/><rect x="20" y="256" width="5" height="44" class="ver"/>
<text x="40" y="283" class="t b">○ En análisis</text><text x="150" y="283" class="t">Art. 12 · Res. SB-2020-045  ↔  Sección 5.2 · Manual de seguridad TI</text><text x="1040" y="283" class="g" text-anchor="end">▸</text>
<rect x="20" y="304" width="1060" height="44" class="p"/><rect x="20" y="304" width="5" height="44" class="ver"/>
<text x="40" y="331" class="t b">○ En análisis</text><text x="150" y="331" class="t">Art. 13 · Res. SB-2020-045  ↔  Sección 5.3 · Manual de seguridad TI</text><text x="1040" y="331" class="g" text-anchor="end">▸</text>

<!-- nuevos -->
<rect x="400" y="362" width="300" height="26" rx="13" class="chipa"/><text x="550" y="380" text-anchor="middle" class="t b">3 resultados nuevos · Mostrar</text>

<!-- RESUELTOS -->
<rect x="20" y="398" width="1060" height="44" class="p"/>
<text x="40" y="425" fill="#8a5d00" class="b">◐ Cubre en parte</text><text x="200" y="425" class="t">Art. 11 ↔ Sección 4.7</text><text x="520" y="425" class="g">✓ Citas verificadas</text><text x="1040" y="425" class="g" text-anchor="end">▸</text>
<rect x="20" y="446" width="1060" height="250" class="p" stroke="#1E7B4F"/>
<text x="40" y="473" fill="#c23b32" class="b">✕ No lo cubre</text><text x="200" y="473" class="t">Art. 10 ↔ Sección 4.2</text><text x="520" y="473" fill="#8a5d00">⚠ Citas por revisar</text><text x="1040" y="473" class="g" text-anchor="end">▾</text>
<rect x="36" y="486" width="500" height="120" class="lit"/><text x="48" y="506" class="g" font-size="12">Cita de la norma · Res. SB-2020-045 · Art. 10 · pág. 14</text>
<text x="48" y="530" class="t">«Las entidades deberán cifrar la información</text><text x="48" y="548" class="t">sensible en tránsito y en reposo…»</text><text x="48" y="580" fill="#2e7d32" font-size="12">✓ Verificada en el texto</text>
<rect x="552" y="486" width="512" height="120" class="lit"/><text x="564" y="506" class="g" font-size="12">Cita del manual · Manual de seguridad TI · Sec. 4.2 · pág. 9</text>
<text x="564" y="530" class="t">«Las contraseñas se renuevan cada 90 días…»</text><text x="564" y="580" fill="#8a5d00" font-size="12">⚠ No pudimos confirmarla; es el fragmento más cercano</text>
<text x="36" y="632" class="t b">Qué falta</text><text x="36" y="652" class="t">• No se menciona el cifrado de información en reposo.</text>
<text x="36" y="676" class="g" font-size="12">Confianza del modelo 62 % · Ver comentario del modelo (plegado)</text>
<rect x="20" y="700" width="1060" height="44" class="p"/>
<text x="40" y="727" class="ver b">● Cubre por completo</text><text x="200" y="727" class="t">Art. 9 ↔ Sección 3.1</text><text x="520" y="727" class="g">✓ Citas verificadas</text><text x="1040" y="727" class="g" text-anchor="end">▸</text>
<rect x="400" y="752" width="300" height="30" rx="6" class="btn"/><text x="550" y="772" text-anchor="middle" fill="#1E7B4F" class="b">Mostrar 50 más (quedan 120)</text>

<!-- anotaciones -->
<g class="n">
<circle cx="8" cy="80" r="9"/><text x="8" y="84">1</text>
<circle cx="8" cy="128" r="9"/><text x="8" y="132">2</text>
<circle cx="860" cy="84" r="9"/><text x="860" y="88">3</text>
<circle cx="8" cy="180" r="9"/><text x="8" y="184">4</text>
<circle cx="8" cy="280" r="9"/><text x="8" y="284">5</text>
<circle cx="380" cy="376" r="9"/><text x="380" y="380">6</text>
<circle cx="8" cy="422" r="9"/><text x="8" y="426">7</text>
<circle cx="8" cy="560" r="9"/><text x="8" y="564">8</text>
<circle cx="380" cy="767" r="9"/><text x="380" y="771">9</text>
</g>
<text x="36" y="805" class="g" font-size="11">1 Un solo paso/fase · 2 Contador de pares y UN solo tiempo</text>
<text x="36" y="821" class="g" font-size="11">3 Cancelar siempre visible (resumen fijo) · 4 Filtros = conteos</text>
<text x="36" y="837" class="g" font-size="11">5 Par en análisis: misma fila, arriba · 6 Nuevos retenidos si lees</text>
<text x="36" y="853" class="g" font-size="11">7 Resultado dentro de la fila · 8 Detalle con citas lado a lado</text>
<text x="36" y="869" class="g" font-size="11">9 Paginación: 50 en 50</text>
</svg>
