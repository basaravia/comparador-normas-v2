<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="sans-serif" font-size="13">
<title>Aviso al terminar el paso 1: el PDF no queda guardado (v1)</title>
<rect width="900" height="560" fill="#f4f4f4"/>
<!-- fondo atenuado: Procesando terminado -->
<rect x="20" y="20" width="860" height="520" fill="#e6e6e6" stroke="#bbb"/>
<text x="40" y="50" fill="#888">Procesando los documentos · 100 %</text>
<!-- modal -->
<rect x="170" y="90" width="560" height="340" rx="6" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="195" y="125" font-size="17" font-weight="bold">1  Tus documentos están listos. Guarda tus PDF.</text>
<text x="195" y="160">2  Esta aplicación no guarda tus PDF. Solo conserva los datos del</text>
<text x="195" y="180">    documento y su contenido preparado para buscar, mientras la</text>
<text x="195" y="200">    aplicación siga abierta. Si se reinicia, tendrás que cargarlos de nuevo.</text>
<text x="195" y="230">3  Conserva tu PDF original y anota qué archivo es (nombre, versión, fecha).</text>
<text x="195" y="250">    Lo necesitarás para respaldar el papel de trabajo.</text>
<rect x="195" y="270" width="510" height="56" fill="#f4f4f4" stroke="#999"/>
<text x="205" y="292">norma_sb_2024.pdf · 55 pág.      manual_la_ft.pdf · 32 pág.</text>
<text x="205" y="312" fill="#555">(lista de lo recién procesado)</text>
<text x="215" y="355">4  [ ] No volver a mostrar en esta sesión</text>
<rect x="195" y="360" width="16" height="16" fill="#fff" stroke="#333"/>
<rect x="540" y="380" width="165" height="36" rx="4" fill="#2e7d32"/>
<text x="560" y="403" fill="#fff" font-weight="bold">5  Entendido, continuar</text>
<text x="195" y="404" fill="#555">Foco inicial: botón 5. Esc = igual que 5.</text>
<!-- selección -->
<rect x="20" y="450" width="860" height="90" fill="#fff" stroke="#bbb"/>
<text x="35" y="475" font-weight="bold">Pantalla Selección (tras cerrar)</text>
<rect x="35" y="485" width="830" height="40" fill="#fff8e1" stroke="#c9a227"/>
<text x="45" y="509">6  ⓘ Conserva los PDF originales.   [Ver aviso]   [Agregar documentos]</text>
</svg>
